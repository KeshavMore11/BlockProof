<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Blockchain Certificate Verification System"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&display=swap" rel="stylesheet"/>
    <title>BlockProof - Certificate Verification</title>

    <style>
      @keyframes shimmer {
        0%   { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      @keyframes particle-float {
        0%   { transform: translateY(0px) scale(1);   opacity: 0.6; }
        50%  { transform: translateY(-6px) scale(1.2); opacity: 1;   }
        100% { transform: translateY(0px) scale(1);   opacity: 0.6; }
      }

      @keyframes glow-pulse {
        0%,100% { box-shadow: 0 4px 20px rgba(251,191,36,0.3), 0 0 0 1px rgba(251,191,36,0.2); }
        50%      { box-shadow: 0 6px 32px rgba(251,191,36,0.55), 0 0 0 1px rgba(251,191,36,0.35); }
      }

        #cert-scanner-portal {
        display: flex;
        justify-content: center;
        padding: 10px 0 10px;  /* less top, more bottom */
    }
      .btn-cert-scanner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 13px 28px;
        border-radius: 13px;
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        border: none;
        color: #1a0f00;
        letter-spacing: -0.01em;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;

        background: linear-gradient(
          270deg,
          #f59e0b,
          #fbbf24,
          #fde68a,
          #f59e0b,
          #d97706
        );
        background-size: 300% auto;
        box-shadow: 0 4px 20px rgba(251,191,36,0.3), 0 0 0 1px rgba(251,191,36,0.2);
      }

      /* Glass sheen overlay */
      .btn-cert-scanner::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255,255,255,0.22) 0%,
          rgba(255,255,255,0.04) 50%,
          transparent 100%
        );
        pointer-events: none;
        border-radius: inherit;
      }

      /* Animated sweep line on hover */
      .btn-cert-scanner::after {
        content: '';
        position: absolute;
        top: 0; left: -75%;
        width: 50%; height: 100%;
        background: linear-gradient(
          120deg,
          transparent 0%,
          rgba(255,255,255,0.28) 50%,
          transparent 100%
        );
        transform: skewX(-15deg);
        transition: none;
        pointer-events: none;
        border-radius: inherit;
      }

      .btn-cert-scanner:hover::after {
        transition: left 0.55s ease;
        left: 135%;
      }

      .btn-cert-scanner:hover {
        transform: translateY(-3px) scale(1.03);
        animation: shimmer 2.5s linear infinite, glow-pulse 1.8s ease-in-out infinite;
        background-size: 300% auto;
      }

      .btn-cert-scanner:active {
        transform: scale(0.97);
        box-shadow: 0 2px 10px rgba(251,191,36,0.25);
      }

      .btn-cert-scanner svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      }

      .btn-cert-scanner:hover svg {
        transform: rotate(-12deg) scale(1.15);
      }

      .btn-cert-scanner .cs-badge {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: rgba(26,15,0,0.15);
        padding: 2px 7px;
        border-radius: 5px;
        transition: background 0.2s;
      }

      .btn-cert-scanner:hover .cs-badge {
        background: rgba(26,15,0,0.25);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <div id="cert-scanner-portal">
      <button class="btn-cert-scanner" onclick="window.open('http://localhost:3050')">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
        </svg>
        Certificate Scanner
        <span class="cs-badge">AI</span>
      </button>
    </div>

    <script>
      (function () {
        var attempts = 0;
        var interval = setInterval(function () {
          attempts++;
          var header = document.querySelector('header, nav, .navbar, [class*="Header"], [class*="header"], [class*="AppBar"]');
          if (header) {
            header.insertAdjacentElement('afterend', document.getElementById('cert-scanner-portal'));
            clearInterval(interval);
          } else if (attempts >= 50) {
            clearInterval(interval);
          }
        }, 100);
      })();
    </script>
  </body>
</html>
